<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TomLauncher V2</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <input type="file" id="hidden-file-input" style="display:none">
  <input type="file" id="hidden-icon-input" accept="image/*,.ico" style="display:none">

  <div id="app-container">
    <!-- Header Bar -->
    <header id="app-header">
      <div class="header-left"></div>

      <div class="header-center">
        <div class="mode-toggle-group">
          <button type="button" id="btn-mode-launch" class="mode-btn active" title="Launcher Mode (Click to execute)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            Launch Mode
          </button>
          <button type="button" id="btn-mode-edit" class="mode-btn" title="Edit Mode (Click cell to configure)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 20h9"></path>
              <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
            </svg>
            Edit Mode
          </button>
        </div>
      </div>

      <div class="header-right">
        <div id="queue-badge" class="queue-badge hidden" title="Queued shortcuts to launch on hide">
          <span id="queue-count">0</span> queued
        </div>
        <button type="button" id="btn-settings" class="icon-btn" title="Global Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Grid Content Area -->
    <main id="app-main">
      <div id="launcher-grid-wrapper">
        <div id="launcher-grid"></div>
      </div>
    </main>

    <!-- Status / Hint Bar -->
    <footer id="app-footer">
      <div id="status-hint">
        <span class="hint-key">Shift + Click</span> or <span class="hint-key">Right Click</span> to queue items
      </div>
    </footer>
  </div>

  <!-- Modal: Edit Shortcut -->
  <div id="modal-edit" class="modal-backdrop hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="edit-modal-title">Edit Cell (Row 1, Col 1)</h3>
        <button type="button" class="modal-close" id="btn-close-edit">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="edit-name">Display Name</label>
          <input type="text" id="edit-name" placeholder="e.g. Visual Studio Code">
        </div>
        <div class="form-group">
          <label for="edit-path">Target Executable / File / Directory</label>
          <div class="input-with-button">
            <input type="text" id="edit-path" placeholder="C:\Program Files\...">
            <button type="button" id="btn-browse-file" class="btn secondary">Browse</button>
          </div>
        </div>
        <div class="form-group">
          <label for="edit-args">Arguments / Parameters (Optional)</label>
          <input type="text" id="edit-args" placeholder='e.g. /run /tn "Arknights"'>
        </div>
        <div class="form-group">
          <label for="edit-icon">Icon Image Path (Optional)</label>
          <div class="input-with-button">
            <input type="text" id="edit-icon" placeholder="Leave empty for auto-extracted icon">
            <button type="button" id="btn-browse-icon" class="btn secondary">Browse</button>
          </div>
        </div>
        <div id="icon-preview-box" class="icon-preview-container">
          <span class="preview-label">Icon Preview:</span>
          <img id="edit-icon-preview" src="" alt="Preview" class="hidden">
          <span id="no-icon-text">Auto Extracted Icon</span>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" id="btn-delete-shortcut" class="btn danger">Delete Shortcut</button>
        <div class="modal-footer-right">
          <button type="button" id="btn-cancel-edit" class="btn secondary">Cancel</button>
          <button type="button" id="btn-save-edit" class="btn primary">Save Shortcut</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Global Settings -->
  <div id="modal-settings" class="modal-backdrop hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Global Settings</h3>
        <button type="button" class="modal-close" id="btn-close-settings">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-row">
          <div class="form-group half">
            <label for="setting-rows">Rows (1-20)</label>
            <input type="number" id="setting-rows" min="1" max="20" value="5">
          </div>
          <div class="form-group half">
            <label for="setting-cols">Columns (1-20)</label>
            <input type="number" id="setting-cols" min="1" max="20" value="5">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group half">
            <label for="setting-width">Cell Width (px)</label>
            <input type="number" id="setting-width" min="80" max="400" value="150">
          </div>
          <div class="form-group half">
            <label for="setting-height">Cell Height (px)</label>
            <input type="number" id="setting-height" min="30" max="150" value="40">
          </div>
        </div>
        <div class="form-group">
          <label for="setting-hotkey">Global Hotkey</label>
          <input type="text" id="setting-hotkey" value="Alt+Shift+Z" placeholder="e.g. Alt+Shift+Z">
        </div>
        <div class="form-group checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="setting-center-mouse">
            <span>Center mouse cursor and window on shortcut activation</span>
          </label>
        </div>
        <div class="form-group checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="setting-debug-logging">
            <span>Enable debug logging to debug.log</span>
          </label>
        </div>
        <div class="form-group">
          <label for="setting-theme">Color Theme</label>
          <select id="setting-theme">
            <option value="dark">Dark Theme (Default)</option>
            <option value="light">Light Theme</option>
          </select>
        </div>
        <div class="form-row">
          <div class="form-group half">
            <div class="label-with-action">
              <label for="setting-cell-color">Cell Color</label>
              <button type="button" id="btn-reset-cell-color" class="link-btn">Reset</button>
            </div>
            <div class="color-picker-input">
              <input type="color" id="setting-cell-color" value="#222630">
              <input type="text" id="setting-cell-color-text" class="color-text-input" value="#222630" placeholder="#222630">
            </div>
          </div>
          <div class="form-group half">
            <div class="label-with-action">
              <label for="setting-highlight-color">Highlight Color</label>
              <button type="button" id="btn-reset-highlight-color" class="link-btn">Reset</button>
            </div>
            <div class="color-picker-input">
              <input type="color" id="setting-highlight-color" value="#2d3240">
              <input type="text" id="setting-highlight-color-text" class="color-text-input" value="#2d3240" placeholder="#2d3240">
            </div>
          </div>
        </div>
        <div class="form-group">
          <label for="setting-filepath">Settings File Location</label>
          <div class="input-with-button">
            <input type="text" id="setting-filepath" readonly value="" placeholder="Settings file path">
            <button type="button" id="btn-open-settings-folder" class="btn secondary">Open Folder</button>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" id="btn-exit-app" class="btn danger">Exit TomLauncher</button>
        <div class="modal-footer-right">
          <button type="button" id="btn-cancel-settings" class="btn secondary">Cancel</button>
          <button type="button" id="btn-save-settings" class="btn primary">Save &amp; Apply</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
